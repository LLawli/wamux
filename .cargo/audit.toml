# cargo-audit policy. Every entry here is a decision with a reason and a
# trigger to revisit, never a way to quiet the tool.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa: Marvin attack (timing sidechannel), no patch
    # upstream. NOT REACHABLE HERE: rsa is pulled by sqlx-mysql, and this
    # project builds sqlx with default-features = false plus only postgres and
    # sqlite. `cargo tree -i rsa --target all` finds no path to it; it exists
    # in Cargo.lock only because the lockfile records the whole feature
    # universe. Revisit the moment a mysql feature is enabled.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0141 — bincode is unmaintained (the team stopped work).
    # Not a vulnerability: an advisory about maintenance. Since #31 the store
    # writes protobuf, and bincode is only READ, once, to convert a store
    # written before that (storage/bincode_upgrade.rs), on data this daemon
    # wrote itself. 0.2.x is the last line that converts: 0.3.0 deletes this
    # entry together with that module and the dependency, and refuses a store
    # that is still bincode (#84, #179).
    "RUSTSEC-2025-0141",
]
