name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pinned nightly (rust-toolchain.toml) is what every job resolves to;
# rustup honors that file automatically, so no job names a toolchain by hand.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that needs no database. This is the gate that gives fast
  # feedback on a PR, and it only became possible once the SQLite engine
  # landed: before it, every test required a Postgres service container.
  quick:
    name: fmt + clippy + tests (sqlite)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-cache puts every toolchain `rustup toolchain list` reports into its
      # key hash. The hosted images (Linux and macOS) ship a preinstalled stable
      # whose version differs between images of the same label, so the same
      # commit restores on one image and compiles cold on the next. The cache
      # step runs inside the action below, after the install, so only a step
      # before it can take the stable out of the hash: drop every toolchain and
      # let the action install just the nightly from rust-toolchain.toml (#237).
      # With no toolchain installed, the loop's one "name" is rustup's
      # "no installed toolchains" line, which uninstall skips with exit 0.
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Reads channel and components from rust-toolchain.toml, and caches
          # the toolchain plus ~/.cargo and target/. Without the cache each run
          # re-downloads a whole nightly.
          cache: true

      # Same script as the full job, minus the database-backed gates. The
      # first version of this workflow ran a bare `cargo test` here and failed:
      # the suite legitimately contains Postgres-backed cases (engine parity
      # needs both engines), so "no database" is a property of the pipeline,
      # not something a YAML step can assume.
      - run: scripts/ci.sh --no-postgres

  # The real pipeline. scripts/ci.sh is the single definition of what "green"
  # means for this project, so CI runs that script rather than restating its
  # stages here - two copies of a pipeline drift, and the local one is what
  # people actually run before pushing. It repeats fmt/clippy from `quick`,
  # which costs nothing in wall clock because the jobs run in parallel.
  full:
    name: scripts/ci.sh (postgres)
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wamux
          POSTGRES_PASSWORD: wamux
          POSTGRES_DB: wamux
        # 5433 on the host matches the port the project uses everywhere
        # (CLAUDE.md, the test default DSN), so no override is needed.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wamux"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keeps the runner image's stable out of the cache key, see the `quick` job in ci.yml (#237).
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: full pipeline
        env:
          DATABASE_URL: postgres://wamux:wamux@localhost:5433/wamux
        run: scripts/ci.sh

  # The same database-free gates on macOS (#231), so a change that only breaks
  # there (a Linux-only API, a /proc read) fails the PR, not the release. No
  # Postgres: macOS runners have no Docker, and the SQLite and Turso engines
  # are what a Mac install uses.
  macos:
    name: scripts/ci.sh (macos, sqlite)
    # Pinned, not macos-latest: the label would move under the cache and the SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keeps the runner image's stable out of the cache key, see the `quick` job in ci.yml (#237).
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      # ci.sh runs python scripts that import tomllib (3.11+), and the system
      # python3 on a macOS runner is older than that.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: scripts/ci.sh --no-postgres

  # The release PKG built and installed on every PR (#231), so the packaging
  # path is exercised before a tag instead of failing on it. It runs beside the
  # `macos` job, not after it, to keep the PR's wall clock at the slower one.
  macos-pkg:
    name: macos pkg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keeps the runner image's stable out of the cache key, see the `quick` job in ci.yml (#237).
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The universal binary needs both Apple targets; the toolchain from
      # rust-toolchain.toml only installs the host's.
      - name: apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The manifest is the only version a PR has (there is no tag), read the
      # way release-tarball.sh reads it.
      - name: build and check the pkg
        run: |
          version=$(awk '/^\[workspace\.package\]/{p=1} p && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)
          scripts/release-pkg.sh "$version"
          scripts/check-macos-pkg.sh "dist/wamux-${version}-macos-universal.pkg"

  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # audit-check reports findings through the checks API rather than by
      # failing opaquely.
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Still node20: upstream has no node24 release, so the runner warns. Kept
      # on purpose, pinned by SHA until one exists (#78).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
