name: Pages

# The client snippet page (#280): site/ as is, no build step. schema.json is
# committed and scripts/ci.sh fails when it falls behind the protos, so what
# main holds is what gets published.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One deploy at a time, and a newer push supersedes a queued one. A running
# deploy is not cancelled, so the site is never left half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    name: upload site/
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: upload
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
