name: Release

on:
  push:
    tags: ["v*.*.*"]

# Nothing is granted by default (#78): each job asks for exactly what it needs,
# so a new job or a compromised step starts with no token scopes at all.
permissions: {}

jobs:
  # The two builds run in parallel and publish nothing: `release` waits for
  # both, so a failure on either platform leaves no half-published release.
  linux:
    name: tarball (linux musl)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Provenance (#78): the OIDC token signs the attestation and
      # attestations: write stores it, so `gh attestation verify` can tie the
      # tarball to this workflow run.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keeps the runner image's stable out of the cache key, see the `quick` job in ci.yml (#237).
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true

      # The release is one static musl binary (#218): the tarball and the scratch
      # image carry the same file. musl-gcc compiles the bundled C code (SQLite,
      # mimalloc); the target is added by hand because the toolchain comes from
      # rust-toolchain.toml.
      - name: musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      # A tag points at a commit CI already tested, but a tag can also be moved
      # or cut from an untested branch. This is cheap insurance against
      # publishing an artifact that does not build clean.
      - name: gates
        run: scripts/ci.sh --no-postgres

      # release-tarball.sh refuses to run when the tag disagrees with the
      # version in [workspace.package], so a mistyped tag fails here instead of
      # shipping a binary whose --version lies.
      - name: build tarball
        run: scripts/release-tarball.sh "${GITHUB_REF_NAME#v}"

      # A scratch image has no loader, so a binary that picked up a dynamic
      # dependency would build fine and fail only at `docker run`.
      - name: binary is static
        run: scripts/check-static-binary.py dist/bin/wamux

      # The Debian package carries the file checked above, never a rebuild of it
      # (#277): build-deb.py only packages, and check-deb.sh compares the bytes,
      # then installs the package on the runner and runs the installed binary.
      - name: build deb
        run: scripts/build-deb.py debian "${GITHUB_REF_NAME#v}" dist/bin/wamux dist

      - name: check deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/check-deb.sh "dist/wamux_${version}_amd64.deb" debian dist/bin/wamux
          ( cd dist && sha256sum "wamux_${version}_amd64.deb" > "wamux_${version}_amd64.deb.sha256" )

      # The image job takes this exact file instead of compiling its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wamux-binary
          path: dist/bin/wamux
          if-no-files-found: error

      # Provenance for the tarball and the .deb (#78). After the build, before
      # the upload: the release job publishes only files that were attested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      # What the release job publishes. Attestations bind to the file's digest,
      # so the copy it downloads verifies against the one attested here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wamux-release-tarball
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  # The Android build (#277): one bionic binary, packaged as a tarball and as a
  # Termux .deb. The linux job already ran the gates on this commit, so this one
  # only builds and checks what it ships.
  android:
    name: tarball + deb (android termux)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keeps the runner image's stable out of the cache key, see the `quick` job in ci.yml (#237).
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true

      # The NDK comes with the runner image (ANDROID_NDK_LATEST_HOME), which
      # scripts/android-env.sh reads; only the rust target is added by hand.
      - name: android target
        run: rustup target add aarch64-linux-android

      # Same script and same feature set as the CI job, so the release builds
      # what a pull request already built.
      - name: build tarball
        run: scripts/release-tarball.sh "${GITHUB_REF_NAME#v}" dist aarch64-linux-android

      # Android starts only a bionic aarch64 binary: a static musl one cannot
      # resolve names there.
      - name: binary runs on android
        run: scripts/check-android-binary.py dist/bin/aarch64-linux-android/wamux

      - name: build deb
        run: scripts/build-deb.py termux "${GITHUB_REF_NAME#v}" dist/bin/aarch64-linux-android/wamux dist

      - name: check deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/check-deb.sh "dist/wamux_${version}_aarch64.deb" termux dist/bin/aarch64-linux-android/wamux
          ( cd dist && sha256sum "wamux_${version}_aarch64.deb" > "wamux_${version}_aarch64.deb.sha256" )

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wamux-release-android
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  macos:
    name: pkg (macos universal)
    # A pinned image, not macos-latest: the PKG is built on this exact SDK.
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keeps the runner image's stable out of the cache key, see the `quick` job in ci.yml (#237).
      - name: drop the runner's toolchains
        run: rustup toolchain list --quiet | while read -r name; do rustup toolchain uninstall "$name"; done

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true

      # ci.sh runs python scripts that import tomllib (3.11+), and the system
      # python3 on a macOS runner is older than that.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The PKG is a universal binary: both Apple targets are built here, and
      # the toolchain from rust-toolchain.toml only installs the host's.
      - name: apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Same reason as the linux job. No Postgres: macOS runners have no Docker.
      - name: gates
        run: scripts/ci.sh --no-postgres

      # release-pkg.sh refuses to run when the tag disagrees with the version
      # in [workspace.package], like release-tarball.sh.
      - name: build pkg
        run: scripts/release-pkg.sh "${GITHUB_REF_NAME#v}"

      # Installs the PKG on the runner and starts the installed daemon, so a
      # PKG that does not run is caught before anyone downloads it.
      - name: check pkg
        run: scripts/check-macos-pkg.sh "dist/wamux-${GITHUB_REF_NAME#v}-macos-universal.pkg"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.pkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wamux-release-pkg
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [linux, macos, android]
    runs-on: ubuntu-26.04
    # Publishing only: the builds above already hold the attestation scopes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wamux-release-*
          path: dist
          merge-multiple: true

      # Fails when the CHANGELOG has no section for this version, rather than
      # publishing a release with empty notes.
      - name: release notes from CHANGELOG
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > dist/notes.md

      # Appended here, after the CHANGELOG section, so the notes stay a plain
      # file the publish step reads. The image is built by a later job (#78), so
      # it appears minutes after the release itself.
      - name: verification instructions
        run: |
          linux_tarball=$(cd dist && echo *-x86_64-unknown-linux-musl.tar.gz)
          android_tarball=$(cd dist && echo *-aarch64-linux-android.tar.gz)
          debian_deb=$(cd dist && echo *_amd64.deb)
          termux_deb=$(cd dist && echo *_aarch64.deb)
          pkg=$(cd dist && echo *.pkg)
          {
            printf '\n## Verify\n\n'
            printf 'The Linux tarball and the Debian package carry a static musl binary, the Android tarball and the Termux package a bionic one, and the PKG is a universal macOS installer. Every artifact carries a build provenance attestation. The container image is published by a job that starts only after this release succeeds, so it can appear a few minutes later.\n\n'
            printf '```\n'
            for artifact in "$linux_tarball" "$debian_deb" "$android_tarball" "$termux_deb" "$pkg"; do
              printf 'gh attestation verify %s -R %s\n' "$artifact" "$GITHUB_REPOSITORY"
            done
            printf 'gh attestation verify oci://ghcr.io/%s:%s -R %s\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
            printf '```\n'
          } >> dist/notes.md

      - name: Debian and Termux install instructions
        run: |
          debian_deb=$(cd dist && echo *_amd64.deb)
          termux_deb=$(cd dist && echo *_aarch64.deb)
          {
            printf '\n## Install on Debian/Ubuntu\n\n'
            printf 'The package (amd64) installs /usr/bin/wamux and a systemd user unit, and starts nothing:\n\n'
            printf '```\n'
            printf 'curl -LO https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$debian_deb"
            printf 'sudo apt install ./%s\n' "$debian_deb"
            printf 'systemctl --user enable --now wamux\n'
            printf '```\n'
            printf '\n## Install in Termux\n\n'
            printf 'The package (aarch64, Android 7 or newer) installs wamux and a termux-services service, disabled until you enable it. The defaults put the socket, spool and SQLite store under the Termux prefix. See docs/TERMUX.md for what keeps it alive on Android:\n\n'
            printf '```\n'
            printf 'curl -LO https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$termux_deb"
            printf 'apt install ./%s\n' "$termux_deb"
            printf 'pkg install termux-services && sv-enable wamux\n'
            printf '```\n'
          } >> dist/notes.md

      # The PKG is not signed by Apple (no Developer ID, no notarization), so a
      # browser download triggers Gatekeeper. Said here so nobody has to guess.
      - name: macOS install instructions
        run: |
          pkg=$(cd dist && echo *.pkg)
          {
            printf '\n## Install on macOS\n\n'
            printf 'The PKG is a universal binary (Apple silicon and Intel). It is not signed or notarized by Apple, so a PKG downloaded in a browser is blocked by Gatekeeper: open System Settings, Privacy & Security, and choose Open Anyway. A download from the terminal carries no quarantine flag and installs directly:\n\n'
            printf '```\n'
            printf 'curl -LO https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$pkg"
            printf 'sudo installer -pkg %s -target /\n' "$pkg"
            printf '```\n\n'
            printf 'It installs /usr/local/bin/wamux and starts nothing; see /usr/local/share/wamux for the docs and an example LaunchAgent.\n'
          } >> dist/notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "wamux ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            dist/*.tar.gz dist/*.deb dist/*.pkg dist/*.sha256

  image:
    name: ghcr image
    # The image must not exist unless the gates passed (#78): without this the
    # job ran in parallel with `release` and published even when the gates
    # failed.
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR rejects an uppercase path, and the owner here is "LLawli", so the
      # repository slug cannot be used verbatim.
      - name: image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The binary the linux job built and checked. Artifacts lose the exec
      # bit, and the image needs it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wamux-binary
          path: dist/bin

      - name: restore exec bit
        run: chmod +x dist/bin/wamux

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          # Replaces the Dockerfile's `binary` stage with the release binary, so
          # the compile stage never runs and nothing is built in this job.
          build-contexts: |
            binary=dist/bin
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          # The image runs as UID 10001 rather than the builder's user: a
          # published image has no idea who will consume its socket, and
          # docs/DEPLOYMENT.md tells consumers to match this.
          build-args: |
            WAMUX_UID=10001
            WAMUX_GID=10001

      # The pushed image must hold the bytes the linux job tested and
      # attested, not whatever the build context happened to contain.
      - name: image carries the release binary
        run: scripts/check-image-binary.sh "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" dist/bin/wamux

      # Provenance for the pushed digest, not a tag (#78): a tag can move, the
      # digest is what a consumer pulls and `gh attestation verify` checks.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
