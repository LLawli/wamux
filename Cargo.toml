[package]
name = "wamux"
version = "0.1.0"
edition = "2024"
description = "WhatsApp multiplexer core daemon: many accounts, one Unix socket, gRPC."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/LLawli/wamux"

[lib]
name = "wamux"
path = "src/lib.rs"

[features]
# Stress harness: a mock WhatsApp WSS server (server-side Noise XX) so many real
# whatsapp-rust Clients can connect to a local endpoint. Off by default — never
# part of the production daemon.
#
# DANGER: a build with this feature can skip Noise server-certificate-chain
# verification. The mock signs its chain with zeros (`build_cert_chain_bytes`),
# and whatsapp-rust verifies the intermediate's XEdDSA signature against WA's
# root key, which no mock can satisfy. Since upstream #1441/#1444 the skip is a
# per-client runtime policy (`NoiseCertPolicy::DangerSkipCertChainVerify`), no
# longer a cargo feature that disabled the check for the whole build.
#
# The safety net is in `domain::bot_factory`: a build with this feature refuses
# to connect to anything but a loopback endpoint, and it is the only place that
# sets the danger policy. Keep the two welded together.
stress = [
    "dep:tokio-websockets",
    "dep:wacore-noise",
    "dep:wacore-binary",
    "wacore-noise/test-util",
]

[[bin]]
name = "wamux"
path = "src/main.rs"

# Live stress probe (M4): needs the mock from the `stress` feature.
[[bin]]
name = "stress_live"
path = "src/bin/stress_live.rs"
required-features = ["stress"]

[dependencies]
# gRPC / protobuf
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
# NOTE: waproto dropped prost for `buffa` in whatsapp-rust 0.7, so the second
# prost (0.14) this crate used to carry only to reach waproto's Message trait is
# gone. Encoding a wa::Message now goes through `whatsapp_rust::buffa::Message`.

# async runtime + streams + middleware
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tower = "0.5"
futures = "0.3"
async-trait = "0.1"

# storage: both engines, always compiled. No feature gate — the DSN scheme picks
# one at startup, and gating would sprinkle #[cfg] across the storage module for
# the sole benefit of a slightly smaller binary.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "uuid",
] }

# errors / config / ids / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# metrics facade + Prometheus exposition. Rendered over the socket by AdminService;
# default features off to drop the HTTP/TCP listener and push-gateway (no TCP here).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
# http-body Body/Frame traits for the per-request observability tower layer (wraps
# the response body to read the grpc-status trailer at end-of-stream).
http-body = "1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
dashmap = "6"
bytes = "1"
# Reads a store written before #31 (bincode-standard blobs) so
# storage::bincode_upgrade can convert it to protobuf. Delete with that module.
bincode = { version = "2", features = ["serde"] }
serde_json = "1"
# blocking HTTP GET for the "send media from URL" path (run via spawn_blocking)
ureq = "2"
# QR rendering for the pairing validator (pair_cli): matrix -> PNG/ASCII
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# UDS gRPC client (used by the pair_socket validator that drives the real socket)
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"

# whatsapp-rust stack (Postgres backend => drop the default `sqlite-storage`).
#
# Pinned to git `main` by SHA (#30): crates.io is still on 0.7.0 and the fixes
# this project waits on (#15) are only on main. EVERY crate of the family moves
# together: main still declares version 0.7.0, so a crates-io 0.7.0 left behind
# resolves next to the git one and fails as `expected Jid, found Jid`. Always a
# `rev`, never a branch. (`[patch.crates-io]` was ruled out while the one-shot
# migrations pinned a crates.io `wacore` next to the git one; #31 deleted them,
# so that reason is gone.)
#
# `simd` is gone: upstream removed it after measuring what it was worth (#1262).
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306" }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306", default-features = false, features = [
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
] }
whatsapp-rust-tokio-transport = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306" }
whatsapp-rust-ureq-http-client = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306" }

# --- stress harness only (optional; enabled by the `stress` feature) ---
# Server side of the WhatsApp WS endpoint for the mock.
tokio-websockets = { version = "0.13", optional = true, default-features = false, features = [
    "server",
    "ring",
    "rand",
] }
# Noise XX primitives + the e2e cert-chain test fixture (server mirror).
wacore-noise = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306", optional = true, default-features = false }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306", optional = true, default-features = false }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# History-sync fixtures have to compress their payload: 0.7 keeps the chunk
# zlib-compressed behind LazyHistorySync instead of handing over raw bytes.
flate2 = "1"

# The cascade + byte-parity tests inspect the raw pools below the trait.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "postgres",
    "runtime-tokio",
] }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f4d73ebe6b19231993a58b5a151b4920dfad1306" }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
tempfile = "3"
