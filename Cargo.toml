[workspace]
resolver = "3"
members = ["crates/wamux", "crates/wamux-proto", "crates/wamux-tools"]
# A bare `cargo build`/`cargo run` at the root means the daemon; the generated
# code and the development binaries are built on demand (-p / --workspace).
default-members = ["crates/wamux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LLawli/wamux"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# gRPC / protobuf (one version of the transport stack, see scripts/check-dup-deps.sh)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
wamux-proto = { path = "crates/wamux-proto" }
wamux = { path = "crates/wamux" }

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tower = "0.5"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "uuid",
] }

# whatsapp-rust stack (Postgres backend => drop the default `sqlite-storage`).
#
# Pinned to git `main` by SHA (#30): crates.io is still on 0.7.0 and the fixes
# this project waits on (#15) are only on main. EVERY crate of the family moves
# together: main still declares version 0.7.0, so a crates-io 0.7.0 left behind
# resolves next to the git one and fails as `expected Jid, found Jid`. Always a
# `rev`, never a branch. (`[patch.crates-io]` was ruled out while the one-shot
# migrations pinned a crates.io `wacore` next to the git one; #31 deleted them,
# so that reason is gone.)
#
# `simd` is gone: upstream removed it after measuring what it was worth (#1262).
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "23846f7e34c9842ed93c7a099a8f87818089fab7" }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "23846f7e34c9842ed93c7a099a8f87818089fab7", default-features = false, features = [
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
] }
whatsapp-rust-tokio-transport = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "23846f7e34c9842ed93c7a099a8f87818089fab7" }
whatsapp-rust-ureq-http-client = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "23846f7e34c9842ed93c7a099a8f87818089fab7" }
# Stress harness only; the members opt in with `optional = true`.
wacore-noise = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "23846f7e34c9842ed93c7a099a8f87818089fab7", default-features = false }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "23846f7e34c9842ed93c7a099a8f87818089fab7", default-features = false }
