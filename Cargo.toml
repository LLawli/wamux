[package]
name = "wamux"
version = "0.1.0"
edition = "2024"
description = "WhatsApp multiplexer core daemon: many accounts, one Unix socket, gRPC."
license = "MIT OR Apache-2.0"
readme = "README.md"
# repository = "https://…"   # set once the git remote exists

[lib]
name = "wamux"
path = "src/lib.rs"

[features]
# Stress harness: a mock WhatsApp WSS server (server-side Noise XX) so many real
# whatsapp-rust Clients can connect to a local endpoint. Off by default — never
# part of the production daemon.
stress = [
    "dep:tokio-websockets",
    "dep:wacore-noise",
    "dep:wacore-binary",
    "wacore-noise/test-util",
]

[[bin]]
name = "wamux"
path = "src/main.rs"

# Live stress probe (M4): needs the mock from the `stress` feature.
[[bin]]
name = "stress_live"
path = "src/bin/stress_live.rs"
required-features = ["stress"]

[dependencies]
# gRPC / protobuf
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
# waproto (whatsapp-rust's protobufs) is built against prost 0.14; we need its
# Message trait to encode wa::Message. tonic codegen stays on prost 0.13 above.
prost014 = { package = "prost", version = "0.14" }

# async runtime + streams + middleware
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tower = "0.5"
futures = "0.3"
async-trait = "0.1"

# storage: both engines, always compiled. No feature gate — the DSN scheme picks
# one at startup, and gating would sprinkle #[cfg] across the storage module for
# the sole benefit of a slightly smaller binary.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "uuid",
] }

# errors / config / ids / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# metrics facade + Prometheus exposition. Rendered over the socket by AdminService;
# default features off to drop the HTTP/TCP listener and push-gateway (no TCP here).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
# http-body Body/Frame traits for the per-request observability tower layer (wraps
# the response body to read the grpc-status trailer at end-of-stream).
http-body = "1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
dashmap = "6"
bytes = "1"
# serialization formats matching the whatsapp-rust sqlite reference exactly
bincode = { version = "2", features = ["serde"] }
serde_json = "1"
# blocking HTTP GET for the "send media from URL" path (run via spawn_blocking)
ureq = "2"
# QR rendering for the pairing validator (pair_cli): matrix -> PNG/ASCII
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# UDS gRPC client (used by the pair_socket validator that drives the real socket)
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"

# whatsapp-rust stack (Postgres backend => drop the default `sqlite-storage`)
wacore = "0.6.0"
whatsapp-rust = { version = "0.6.0", default-features = false, features = [
    "moka-cache",
    "simd",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
] }
whatsapp-rust-tokio-transport = "0.6.0"
whatsapp-rust-ureq-http-client = "0.6.0"

# --- stress harness only (optional; enabled by the `stress` feature) ---
# Server side of the WhatsApp WS endpoint for the mock.
tokio-websockets = { version = "0.13", optional = true, default-features = false, features = [
    "server",
    "ring",
    "rand",
] }
# Noise XX primitives + the e2e cert-chain test fixture (server mirror).
wacore-noise = { version = "0.6.0", optional = true, default-features = false }
wacore-binary = { version = "0.6.0", optional = true, default-features = false }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The cascade + byte-parity tests inspect the raw pools below the trait.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "postgres",
    "runtime-tokio",
] }
wacore = "0.6.0"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
tempfile = "3"
