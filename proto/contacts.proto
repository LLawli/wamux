syntax = "proto3";

package wamux.v1;

import "common.proto";

message CheckOnWhatsAppRequest {
  AccountRef account = 1;
  // Full JIDs to check, e.g. "<number>@s.whatsapp.net". The core does not guess
  // or normalize: the edge picks the namespace and sends well-formed JIDs.
  repeated string jids = 2;
}

message CheckResult {
  string query = 1;
  bool is_on_whatsapp = 2;
  string jid = 3;
}

message CheckOnWhatsAppResponse {
  repeated CheckResult results = 1;
}

message JidRequest {
  AccountRef account = 1;
  string jid = 2;
}

message ProfilePictureResponse {
  string url = 1;
  bytes image = 2;
}

message SetProfilePictureRequest {
  AccountRef account = 1;
  bytes image = 2;
}

message PushNameResponse {
  string push_name = 1;
}

message SetPushNameRequest {
  AccountRef account = 1;
  string push_name = 2;
}

message AboutResponse {
  string about = 1;
}

message BusinessProfileResponse {
  bytes raw = 1;
}

message SubscribePresenceRequest {
  AccountRef account = 1;
  string jid = 2;
}

// One LID <-> phone-number pair, exactly as the library learned it. Both sides
// render as full JIDs ("<user>@lid" / "<user>@s.whatsapp.net"): the store keeps
// only the user parts, and each side's namespace is fixed by definition. A side
// the store has no user part for comes back empty, never a bare "@lid".
message LidPnMapping {
  string lid = 1;
  string pn = 2;
  int64 created_at = 3;        // unix seconds, when the mapping was first learned
  // The library's own tag for how it learned the pair, verbatim:
  // usync|pairing|peer_pn_message|peer_lid_message|recipient_latest_lid|
  // migration_sync_latest|migration_sync_old|blocklist_active|
  // blocklist_inactive|device_notification|other.
  string learning_source = 4;
}

message ResolveLidPnRequest {
  AccountRef account = 1;
  // Full JIDs, either side of the mapping: a "<user>@lid" answers with its
  // phone jid, a "<user>@s.whatsapp.net" with its LID. Any other namespace
  // answers found=false. The core does not guess: it only reports what the
  // client already knows.
  repeated string jids = 2;
}

// One answer per requested jid, in request order.
message LidPnResult {
  string query = 1;
  bool found = 2;
  LidPnMapping mapping = 3;  // unset when found=false
}

message ResolveLidPnResponse {
  repeated LidPnResult results = 1;
}

message ListLidMappingsResponse {
  repeated LidPnMapping mappings = 1;
}

service ContactService {
  rpc CheckOnWhatsApp(CheckOnWhatsAppRequest) returns (CheckOnWhatsAppResponse);
  rpc GetProfilePicture(JidRequest) returns (ProfilePictureResponse);
  rpc SetProfilePicture(SetProfilePictureRequest) returns (Empty);
  rpc RemoveProfilePicture(AccountRef) returns (Empty);
  // The account's OWN push name (the getter that pairs with SetPushName).
  // Takes an AccountRef, not a jid: WhatsApp gives a companion device no
  // per-contact push-name store, and the previous JidRequest shape read as
  // "what is this contact called" while ignoring the jid (issue #1).
  rpc GetPushName(AccountRef) returns (PushNameResponse);
  rpc SetPushName(SetPushNameRequest) returns (Empty);
  rpc GetAbout(JidRequest) returns (AboutResponse);
  rpc GetBusinessProfile(JidRequest) returns (BusinessProfileResponse);
  rpc SubscribePresence(SubscribePresenceRequest) returns (Empty);
  // Targeted LID<->PN lookup, batched. Reads the live client (in-memory cache
  // first, durable store on miss), so it also sees mappings learned during an
  // offline history replay, which are cached before they are persisted.
  rpc ResolveLidPn(ResolveLidPnRequest) returns (ResolveLidPnResponse);
  // Every LID<->PN pair persisted for the account, for a consumer reconciling
  // its own store in one pass. Reads storage directly, so it answers for a
  // disconnected account too -- and, being the durable side, it misses the
  // in-memory-only mappings ResolveLidPn can still answer.
  rpc ListLidMappings(AccountRef) returns (ListLidMappingsResponse);
}
