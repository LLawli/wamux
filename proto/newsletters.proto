syntax = "proto3";

package wamux.v1;

import "common.proto";
import "contacts.proto";
import "events.proto";
import "newsletter_tallies.proto";

// A channel (`@newsletter`), relayed as the server describes it.
//
// Issue #6: a channel's identity never crossed the contract, so a consumer that
// materialises conversations from the event stream could only address these
// rows by jid. Nothing here is derived or guessed — an inbound newsletter
// message carries an empty `push_name` and a `sender` equal to the newsletter
// jid, and history sync brings no name either, so this is the only place the
// name exists.
message Newsletter {
  string jid = 1;
  string name = 2;
  // Absent fields relay as the proto3 default, never a placeholder.
  string description = 3;
  uint64 subscriber_count = 4;
  string picture_url = 5;
  // Lowercase wire token, same convention as ReceiptEvent.type and
  // CallEvent.action ("verified" / "unverified").
  string verification = 6;
  string state = 7;
  // Whether this account owns/administers the channel, when the server says so.
  string role = 8;
  // Unix seconds, 0 when the server omits it.
  int64 creation_time = 9;
}

message NewsletterList {
  repeated Newsletter newsletters = 1;
}

// One row of a channel's history, as `<messages>` returned it (issue #26).
message NewsletterMessage {
  // The message itself, in the SAME shape the event bus delivers. A channel
  // message is plaintext on the wire (no Signal E2E), so the `<plaintext>`
  // bytes decode to the very `wa.Message` a live event carries, and it goes
  // through the same projection: one concept, one shape, one decoder on the
  // edge.
  //
  // What a history row cannot fill stays at the proto3 default rather than
  // gaining a placeholder: the node carries no sender, no push_name and no
  // alt-namespace jids. `key.from_me` is the ONLY sender information it has
  // (the server's `is_sender`), and `key.remote_jid`/`chat` are the jid the
  // caller asked for, not something read off the node.
  //
  // `timestamp` is milliseconds, like every other timestamp in this contract.
  // The stanza counts in seconds; the conversion happens in the core so the
  // edge never has two units for one field.
  InboundMessage message = 1;
  // Server-assigned and monotonic. This is the pagination cursor (`before`),
  // and the key the server's own side-channel add-ons hang off — a channel
  // reaction is addressed by `server_id`, not by the message id. Distinct from
  // `message.key.id`, which is what edit/revoke key on.
  uint64 server_id = 2;
  // Lowercase wire token the server labelled the row with. Measured live:
  // `text`, `media`, `poll`. Same convention as ReceiptEvent.type — a token
  // this core has never seen relays verbatim instead of being folded into a
  // known one, which is the only reason `poll` survived at all (the library's
  // own enum does not have it and its history parser never sees this node).
  string type = 3;
  repeated NewsletterReactionCount reactions = 4;
  // The poll tally, on a `type = "poll"` row. Empty everywhere else, and empty
  // on a poll nobody has voted in.
  repeated NewsletterPollVote votes = 5;
  // How many times the channel's subscribers forwarded this row. 0 when the
  // server omits the node.
  uint64 forwards_count = 6;
  // `<meta polltype=...>`: "creation" on the poll itself. Relayed because it is
  // what tells a `type = "poll"` row apart from whatever else the server may
  // label `poll`. Empty when there is no `<meta>`.
  string poll_type = 7;
  // The row's `edit` attribute, verbatim (#44). Empty when absent, which is
  // the common case. It is what tells a revoked row, whose body the server
  // empties, apart from a row whose body did not decode: both carry an empty
  // `message.raw_message`, and only this says which. Per the library's
  // `EditAttribute`: "3" admin edit, "8" admin revoke. Mapping a token to a
  // meaning is the edge's job; an unknown one relays as sent.
  string edit = 8;
  // When a touched row was first posted and last edited (#51), read off
  // `<meta original_msg_t>` and `<meta msg_edit_t>`. The server counts the
  // first in seconds and the second in milliseconds, in the same node; both
  // cross here in milliseconds, like every timestamp in this contract. 0 when
  // the attribute is absent.
  //
  // Measured live 2026-09-25 (two channels, 200 rows): an edited row
  // (`edit = "3"`) carries both, a revoked one (`"8"`) only the original, an
  // untouched one neither. On an edited row `message.timestamp` is the EDIT
  // time, so `original_timestamp` is the only place the posting time survives.
  int64 original_timestamp = 9;
  int64 last_edit_timestamp = 10;
}

// Read a page of a channel's history, newest first.
message GetNewsletterMessagesRequest {
  AccountRef account = 1;
  string jid = 2;
  // How many rows to ask for. Required: 0 would ask the server for nothing,
  // and picking a default here would be the core choosing a page size for the
  // edge. InvalidArgument when unset.
  uint32 count = 3;
  // Paginate backwards: a `server_id` from an earlier answer, whereupon the
  // reply holds only rows older than it. 0 starts at the newest.
  uint64 before = 4;
}

message NewsletterMessageList {
  repeated NewsletterMessage messages = 1;
}

// Vote in a channel poll (issue #26). A channel is not E2E, so this is not
// `SendPollVote`: no `message_secret`, no encryption. Each option is named by
// its hash, the same `NewsletterPollVote.option_hash` the tallies use.
//
// Measured live 2026-09-25 on the WhatsApp channel's poll: every send carries
// the WHOLE selection and the server keeps exactly the last list, and an empty
// list removes the vote. Read the result back with GetMyNewsletterAddOns.
message SendNewsletterPollVoteRequest {
  AccountRef account = 1;
  string jid = 2;         // the channel, `...@newsletter`
  // The POLL's server_id (`NewsletterMessage.server_id`), not a new id.
  uint64 server_id = 3;
  // 32 bytes each: sha256 of the option name exactly as the poll payload
  // spells it (names carry variation selectors and ZWJ; a retyped name hashes
  // to an option the server does not know). At most 1000, none repeated.
  // InvalidArgument otherwise, before anything is sent.
  repeated bytes option_hashes = 4;
}

message SendNewsletterPollVoteResponse {
  // The vote stanza's id. The server's verdict is the ServerAckEvent with this
  // `id`; no ack for it means the server never took it. There is no echo: a
  // vote puts no message in the channel.
  string stanza_id = 1;
}

// This account's own add-ons on a channel's recent messages (issue #26).
message GetMyNewsletterAddOnsRequest {
  AccountRef account = 1;
  string jid = 2;
  // How many messages to ask about. Required, like GetNewsletterMessages.count:
  // InvalidArgument when 0.
  uint32 limit = 3;
}

message NewsletterMyReaction {
  string code = 1;
  int64 timestamp = 2;  // ms
}

message NewsletterMyPollVote {
  // ms. The server's `t` for the last vote sent, equal to that vote's ack `t`
  // (3 of 3 measured).
  int64 timestamp = 1;
  // The selection the server holds, 32 bytes each. EMPTY after the vote was
  // removed: the server keeps a removal as a dated, empty selection.
  repeated bytes option_hashes = 2;
}

// One message's add-ons. Each is absent when this account has none on it, so
// an absent `poll_vote` (never voted) is not the same as one with no hashes
// (vote removed).
message NewsletterMyAddOns {
  uint64 server_id = 1;
  NewsletterMyReaction reaction = 2;
  NewsletterMyPollVote poll_vote = 3;
}

message NewsletterMyAddOnsList {
  // Only messages this account has an add-on on (the library's reading of the
  // answer). Measured once: with limit 20, only the one poll voted on came back.
  repeated NewsletterMyAddOns messages = 1;
}

message SubscribeNewsletterLiveUpdatesResponse {
  // How long the server keeps pushing, in seconds. Measured live: 90. The
  // library answers 300 when the server omits the attribute; that fallback is
  // its, not the server's.
  uint64 duration_seconds = 1;
}

service NewsletterService {
  // Every channel this account follows. The startup call: it lets a consumer
  // name every newsletter row it already holds in one round trip, the way
  // GroupService.ListParticipating does for groups.
  rpc ListSubscribedNewsletters(AccountRef) returns (NewsletterList);
  // One channel, for a jid that turned up in a message before the list was
  // fetched.
  rpc GetNewsletterMetadata(JidRequest) returns (Newsletter);
  // A page of a channel's history (issue #26). Plain IQ, no decryption: a
  // channel is not E2E, so the server hands back the payloads itself.
  //
  // It is also the only road to a channel's server-side tallies, and they are
  // the reason it exists. Those add-ons never arrive as messages — a channel
  // reaction is a server node, not a `ReactionMessage`, and in 2244 channel
  // payloads measured on one live store not one carried a
  // `pollResultSnapshotMessage`. Reaction counts, poll votes and forward counts
  // are counted by the server and handed over here, and pushed as
  // NewsletterLiveUpdate events to a subscriber of the channel.
  rpc GetNewsletterMessages(GetNewsletterMessagesRequest) returns (NewsletterMessageList);
  // Vote in a channel poll, or change or remove the vote (issue #26).
  rpc SendNewsletterPollVote(SendNewsletterPollVoteRequest) returns (SendNewsletterPollVoteResponse);
  // This account's own reaction and poll vote per message: the only way to read
  // back a vote, since the tallies count every follower.
  rpc GetMyNewsletterAddOns(GetMyNewsletterAddOnsRequest) returns (NewsletterMyAddOnsList);
  // Ask the server to push this channel's tallies as NewsletterLiveUpdate
  // events, for the answered duration. Without it none arrive. Renewing before
  // the duration runs out is the caller's timer: the core keeps none.
  rpc SubscribeNewsletterLiveUpdates(JidRequest) returns (SubscribeNewsletterLiveUpdatesResponse);
}
