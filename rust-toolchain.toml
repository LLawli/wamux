# Stable, aligned with the whatsapp-rust revision pinned in the root
# Cargo.toml, [workspace.dependencies] (#30): upstream builds and tests on this
# exact release, so it is the toolchain the pinned graph is validated against.
# Re-align it on every bump.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "rust-src"]
profile = "default"
