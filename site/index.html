<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wamux client snippets</title>
  <meta name="description" content="Client code for the wamux gRPC socket in grpcurl, Python, Go, Rust and JavaScript, generated from its .proto files.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23128c5e'/%3E%3Cpath d='M4 5l3 3-3 3M8.5 11H12' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>wamux <span>client snippets</span></h1>
    <a class="icon-button" href="https://github.com/LLawli/wamux" title="Source on GitHub" aria-label="Source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>

  <main>
    <nav class="steps" id="presets" aria-label="First steps"></nav>

    <section class="pick">
      <label>Service <select id="service"></select></label>
      <label>RPC <select id="method" title="&#8647; server stream, &#8649; client stream"></select></label>
      <label>Socket <input id="socket" value="/run/wamux.sock" spellcheck="false" autocomplete="off"></label>
    </section>

    <div class="grid">
      <section class="pane" aria-label="Request">
        <code class="signature" id="signature"></code>
        <p class="doc" id="doc" hidden></p>
        <div class="pane-head">
          <span class="label">Request</span>
          <span class="status" id="status" role="status"></span>
          <button type="button" class="icon-button" id="reset" title="Reset to the skeleton" aria-label="Reset to the skeleton">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <textarea id="request" spellcheck="false" autocomplete="off" aria-label="Request JSON"></textarea>
        <details class="fields" open>
          <summary id="fields-title">Fields</summary>
          <ul id="fields"></ul>
        </details>
      </section>

      <section class="pane" id="snippet-pane" aria-label="Snippet">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="code">
          <button type="button" class="icon-button copy" id="copy" title="Copy" aria-label="Copy the snippet">
            <svg class="i-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 3.5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            <svg class="i-done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <pre><code id="snippet"></code></pre>
        </div>
        <details class="stubs">
          <summary>Stubs</summary>
          <div class="code">
            <button type="button" class="icon-button copy" id="copy-stubs" title="Copy" aria-label="Copy the stub commands">
              <svg class="i-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 3.5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg class="i-done" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <pre><code id="stubs"></code></pre>
          </div>
        </details>
      </section>
    </div>
  </main>

  <script src="snippets.js"></script>
  <script src="languages.js"></script>
  <script src="rust.js"></script>
  <script src="app.js"></script>
</body>
</html>
